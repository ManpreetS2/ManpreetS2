<svg viewBox="0 0 390 130" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Footer">
  <style>
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .draw { stroke-dasharray:350; stroke-dashoffset:0; }
    .rise,.fade,.row { opacity:1; }
    @keyframes draw { from { stroke-dashoffset:350; } to { stroke-dashoffset:0; } }
    .a1{animation-delay:.08s} .a2{animation-delay:.16s} .a3{animation-delay:.24s}
    .a4{animation-delay:.32s} .a5{animation-delay:.4s} .a6{animation-delay:.48s}
    .r1{animation-delay:.1s} .r2{animation-delay:.2s} .r3{animation-delay:.3s}
    .r4{animation-delay:.4s} .r5{animation-delay:.5s}
    @media (prefers-reduced-motion: no-preference) {
      .draw { animation:draw 1.1s cubic-bezier(.6,0,.2,1) forwards; }
    }
</style>
  <line class="draw a1" x1="20" y1="16" x2="370" y2="16" stroke="#B0BACC"/>
  <circle cx="28" cy="44" r="4" fill="#0B8F8A"/>
  <text class="mono fade a2" x="44" y="48" fill="#0F1729" font-size="13" letter-spacing="2">MANPREET SINGH</text>
  <text class="mono fade a2" x="20" y="78" fill="#3D4A5F" font-size="12">Open to SE &amp; solutions</text>
  <text class="mono fade a2" x="20" y="98" fill="#3D4A5F" font-size="12">engineering internships</text>
  <text class="mono fade a3" x="20" y="122" fill="#3D4A5F" font-size="11">Bay Area · De Anza → SJSU / 2027</text>
</svg>
