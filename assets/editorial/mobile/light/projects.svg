ng.</text><text x="20" y="388" fill="#0B8F8A" font-size="11">PYTHON · XBRL · DUCKDB</text><rect x="20" y="398" width="120" height="32" fill="none" stroke="#B0BACC"/><line x1="20" y1="430" x2="140" y2="430" stroke="#0B8F8A" stroke-width="1.5"/><polyline fill="none" stroke="#0B8F8A" stroke-width="1.25" points="28,420 48,414 68,416 88,408 108,410"/><circle cx="88" cy="408" r="2.5" fill="none" stroke="#0B8F8A"/><line x1="20" y1="442" x2="370" y2="442" stroke="#B0BACC"/></g><g class="row r4 mono"><text x="20" y="474" fill="#0F1729" font-size="14">04 / MINECRAFT AI CIV.</text><text x="370" y="474" fill="#5A6578" font-size="10" text-anchor="end">IN DEV</text><text x="20" y="496" fill="#3D4A5F" font-size="12">Multi-agent identities, memory,</text><text x="20" y="514" fill="#3D4A5F" font-size="12">planning — still in development.</text><text x="20" y="536" fill="#B85040" font-size="11">TYPESCRIPT · MINEFLAYER</text><rect x="20" y="546" width="120" height="32" fill="none" stroke="#B0BACC"/><line x1="20" y1="578" x2="140" y2="578" stroke="#B85040" stroke-width="1.5"/><circle cx="42" cy="562" r="7" fill="none" stroke="#B85040"/><circle cx="78" cy="562" r="7" fill="none" stroke="#B85040"/><line x1="49" y1="562" x2="71" y2="562" stroke="#B85040"/><line x1="20" y1="590" x2="370" y2="590" stroke="#B0BACC"/></g>
