<svg viewBox="0 0 390 490" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Selected projects">
  <style>
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .draw { stroke-dasharray:350; stroke-dashoffset:0; }
    .rise,.fade,.row { opacity:1; }
    @keyframes draw { from { stroke-dashoffset:350; } to { stroke-dashoffset:0; } }
    @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fade { from { opacity:0; } to { opacity:1; } }
    .a1{animation-delay:.1s} .a2{animation-delay:.25s} .a3{animation-delay:.4s}
    .a4{animation-delay:.55s} .a5{animation-delay:.7s} .a6{animation-delay:.85s}
    .r1{animation-delay:.2s} .r2{animation-delay:.35s} .r3{animation-delay:.5s}
    @media (prefers-reduced-motion: no-preference) {
      .draw { animation:draw 1.3s cubic-bezier(.6,0,.2,1) both; }
      .rise { animation:rise .7s cubic-bezier(.2,.7,.2,1) both; }
      .fade { animation:fade .65s ease both; }
      .row { animation:rise .65s cubic-bezier(.2,.7,.2,1) both; }
    }
</style>
  <g class="row r1 mono"><text x="20" y="30" fill="#0F1729" font-size="14">01 / INTEGRATIONLAB</text><text x="370" y="30" fill="#5A6578" font-size="10" text-anchor="end">PRODUCT</text><text x="20" y="52" fill="#3D4A5F" font-size="12">API/webhook failure console with</text><text x="20" y="70" fill="#3D4A5F" font-size="12">recorded evidence and retries.</text><text x="20" y="92" fill="#0B8F8A" font-size="11">FASTAPI · POSTGRES · REACT</text><line x1="20" y1="110" x2="370" y2="110" stroke="#B0BACC"/></g><g class="row r2 mono"><text x="20" y="142" fill="#0F1729" font-size="14">02 / R.E.A.C.T.</text><text x="370" y="142" fill="#5A6578" font-size="10" text-anchor="end">ILLUSTRATIVE</text><text x="20" y="164" fill="#3D4A5F" font-size="12">Compare LM controller revisions</text><text x="20" y="182" fill="#3D4A5F" font-size="12">with/without reward feedback.</text><text x="20" y="204" fill="#0B8F8A" font-size="11">PYTHON · RESEARCH</text><line x1="20" y1="222" x2="370" y2="222" stroke="#B0BACC"/></g><g class="row r3 mono"><text x="20" y="254" fill="#0F1729" font-size="14">03 / EQUITYTRACE</text><text x="370" y="254" fill="#5A6578" font-size="10" text-anchor="end">ILLUSTRATIVE</text><text x="20" y="276" fill="#3D4A5F" font-size="12">SEC filings, transparent factors,</text><text x="20" y="294" fill="#3D4A5F" font-size="12">reproducible backtesting.</text><text x="20" y="316" fill="#0B8F8A" font-size="11">PYTHON · XBRL · DUCKDB</text><line x1="20" y1="334" x2="370" y2="334" stroke="#B0BACC"/></g><g class="row r4 mono"><text x="20" y="366" fill="#0F1729" font-size="14">04 / MINECRAFT AI CIV.</text><text x="370" y="366" fill="#5A6578" font-size="10" text-anchor="end">IN DEV</text><text x="20" y="388" fill="#3D4A5F" font-size="12">Multi-agent identities, memory,</text><text x="20" y="406" fill="#3D4A5F" font-size="12">planning — still in development.</text><text x="20" y="428" fill="#0B8F8A" font-size="11">TYPESCRIPT · MINEFLAYER</text><line x1="20" y1="446" x2="370" y2="446" stroke="#B0BACC"/></g>
  <text class="mono" x="20" y="478" fill="#5A6578" font-size="11">ALSO · StrikeCaller · PagePulse · Banking · System Down</text>
</svg>
