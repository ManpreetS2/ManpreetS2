<svg viewBox="0 0 390 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="System map mobile">
  <defs><style>
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .sans { font-family:ui-sans-serif,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    
    .draw { stroke-dasharray:400; stroke-dashoffset:0; }
    .rise,.fade,.pop,.row { opacity:1; }
    .flow { stroke-dasharray:3 9; opacity:.35; }
    .pulse { opacity:1; }
    .caret { opacity:1; }
    @keyframes draw { from { stroke-dashoffset:400; } to { stroke-dashoffset:0; } }
    @keyframes rise { from { opacity:0; } to { opacity:1; } }
    @keyframes fade { from { opacity:0; } to { opacity:1; } }
    @keyframes pop { from { opacity:0; } to { opacity:1; } }
    @keyframes march { to { stroke-dashoffset:-12; } }
    @keyframes pulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }
    @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
    .a1{animation-delay:.08s}.a2{animation-delay:.2s}.a3{animation-delay:.35s}
    .a4{animation-delay:.5s}.a5{animation-delay:.65s}.a6{animation-delay:.8s}
    .w1{animation-delay:.15s}.w2{animation-delay:.28s}.w3{animation-delay:.4s}
    .w4{animation-delay:.52s}.w5{animation-delay:.64s}.w6{animation-delay:.76s}
    .p0{animation-delay:.1s}.p1{animation-delay:.45s}.p2{animation-delay:.55s}
    .p3{animation-delay:.65s}.p4{animation-delay:.75s}.p5{animation-delay:.85s}
    .p6{animation-delay:.95s}.p7{animation-delay:1.05s}.p8{animation-delay:1.15s}
    .r1{animation-delay:.05s}.r2{animation-delay:.12s}.r3{animation-delay:.19s}
    .r4{animation-delay:.26s}.r5{animation-delay:.33s}
    @media (prefers-reduced-motion:no-preference) {
      .draw { animation:draw 1.2s cubic-bezier(.6,0,.2,1) both; }
      .rise { animation:rise .65s cubic-bezier(.2,.7,.2,1) both; }
      .fade { animation:fade .55s ease both; }
      .pop { animation:pop .65s cubic-bezier(.2,.7,.2,1) both; }
      .row { animation:rise .5s cubic-bezier(.2,.7,.2,1) both; }
      .flow { animation:march 1.4s linear infinite; }
      .pulse { animation:pulse 2.6s ease-in-out infinite; }
      .caret { animation:blink 1.05s steps(1,end) infinite; }
    }

</style></defs>
  <text class="mono fade a1" x="20" y="24" fill="#4E596E" font-size="11" letter-spacing="2">SYSTEM MAP</text>
  <g class="pop p0">
    <rect x="70" y="48" width="250" height="52" rx="2" fill="#F0F4FA" stroke="#B8C2D4"/>
    <text class="mono" x="195" y="72" fill="#0F1729" font-size="13" letter-spacing="1" text-anchor="middle">MANPREET.SYS</text>
    <text class="mono" x="195" y="90" fill="#4E596E" font-size="10" text-anchor="middle">evidence → systems → control</text>
  </g>
  <line class="draw w1" x1="195" y1="100" x2="195" y2="470" stroke="#B8C2D4"/>
  <g class="pop p1"><rect x="40" y="120" width="310" height="48" rx="2" fill="#F0F4FA" stroke="#0B8F8A" stroke-opacity=".5"/>
    <text class="mono" x="56" y="142" fill="#0B8F8A" font-size="11">PRODUCTS</text>
    <text class="mono" x="56" y="160" fill="#0F1729" font-size="12">CareerPilot · StrikeCaller · PagePulse</text></g>
  <g class="pop p2"><rect x="40" y="184" width="310" height="48" rx="2" fill="#F0F4FA" stroke="#5F4F8F" stroke-opacity=".55"/>
    <text class="mono" x="56" y="206" fill="#5F4F8F" font-size="11">AI EXPERIMENTATION</text>
    <text class="mono" x="56" y="224" fill="#0F1729" font-size="12">R.E.A.C.T. · Minecraft AI Civ.</text></g>
  <g class="pop p3"><rect x="40" y="248" width="310" height="48" rx="2" fill="#F0F4FA" stroke="#B85040" stroke-opacity=".5"/>
    <text class="mono" x="56" y="270" fill="#B85040" font-size="11">RELIABLE INTEGRATIONS</text>
    <text class="mono" x="56" y="288" fill="#0F1729" font-size="12">IntegrationLab · System Down</text></g>
  <g class="pop p4"><rect x="40" y="312" width="310" height="48" rx="2" fill="#F0F4FA" stroke="#0B8F8A" stroke-opacity=".45"/>
    <text class="mono" x="56" y="334" fill="#0B8F8A" font-size="11">QUANTITATIVE RESEARCH</text>
    <text class="mono" x="56" y="352" fill="#0F1729" font-size="12">EquityTrace · Java Banking</text></g>
  <g class="pop p5"><rect x="40" y="390" width="310" height="56" rx="2" fill="#E4EAF5" stroke="#5F4F8F"/>
    <text class="mono" x="56" y="416" fill="#5F4F8F" font-size="12">FLAGSHIP HUB</text>
    <text class="mono" x="56" y="436" fill="#4E596E" font-size="12">CareerPilot ties products ↔ evidence</text></g>
  <text class="mono fade a6" x="20" y="480" fill="#6E7890" font-size="11">shared ideas and dependencies</text>
</svg>
