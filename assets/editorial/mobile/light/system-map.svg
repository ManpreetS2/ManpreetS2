<svg viewBox="0 0 390 390" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="System map mobile">
  <style>
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .draw { stroke-dasharray:350; stroke-dashoffset:0; }
    .rise,.fade,.row { opacity:1; }
    @keyframes draw { from { stroke-dashoffset:350; } to { stroke-dashoffset:0; } }
    .a1{animation-delay:.08s} .a2{animation-delay:.16s} .a3{animation-delay:.24s}
    .a4{animation-delay:.32s} .a5{animation-delay:.4s} .a6{animation-delay:.48s}
    .r1{animation-delay:.1s} .r2{animation-delay:.2s} .r3{animation-delay:.3s}
    .r4{animation-delay:.4s} .r5{animation-delay:.5s}
    @media (prefers-reduced-motion: no-preference) {
      .draw { animation:draw 1.1s cubic-bezier(.6,0,.2,1) forwards; }
    }
</style>
  <text class="mono fade a1" x="20" y="24" fill="#3D4A5F" font-size="11" letter-spacing="2">HOW WORK CONNECTS</text>
  <g class="rise a2">
    <rect x="20" y="40" width="350" height="70" rx="2" fill="#E4EAF5" stroke="#0B8F8A" stroke-width="1.5"/>
    <text class="mono" x="195" y="68" fill="#0B8F8A" font-size="11" letter-spacing="2" text-anchor="middle">FLAGSHIP</text>
    <text class="mono" x="195" y="94" fill="#0F1729" font-size="18" text-anchor="middle">CareerPilot</text>
  </g>
  <!-- Vertical spine connecting stacked nodes -->
  <line class="draw a2" x1="36" y1="110" x2="36" y2="128" stroke="#B0BACC" stroke-width="1.25"/>
  <line class="draw a3" x1="36" y1="176" x2="36" y2="188" stroke="#B0BACC" stroke-width="1.25"/>
  <line class="draw a3" x1="36" y1="236" x2="36" y2="248" stroke="#B0BACC" stroke-width="1.25"/>
  <line class="draw a4" x1="36" y1="296" x2="36" y2="308" stroke="#B0BACC" stroke-width="1.25"/>
  <g class="rise a3"><rect x="20" y="128" width="350" height="48" rx="2" fill="#EEF2F8" stroke="#0B8F8A" stroke-width="1.25"/>
    <text class="mono" x="36" y="148" fill="#0B8F8A" font-size="11">PRODUCTS</text>
    <text class="mono" x="36" y="166" fill="#0F1729" font-size="12">StrikeCaller · PagePulse</text></g>
  <g class="rise a3"><rect x="20" y="188" width="350" height="48" rx="2" fill="#EEF2F8" stroke="#5F4F8F" stroke-width="1.25"/>
    <text class="mono" x="36" y="208" fill="#5F4F8F" font-size="11">AI EXPERIMENTATION</text>
    <text class="mono" x="36" y="226" fill="#0F1729" font-size="12">R.E.A.C.T. · Minecraft AI Civ.</text></g>
  <g class="rise a4"><rect x="20" y="248" width="350" height="48" rx="2" fill="#EEF2F8" stroke="#B85040" stroke-width="1.25"/>
    <text class="mono" x="36" y="268" fill="#B85040" font-size="11">INTEGRATIONS</text>
    <text class="mono" x="36" y="286" fill="#0F1729" font-size="12">IntegrationLab · reliability</text></g>
  <g class="rise a4"><rect x="20" y="308" width="350" height="48" rx="2" fill="#EEF2F8" stroke="#0B8F8A" stroke-width="1.25"/>
    <text class="mono" x="36" y="328" fill="#0B8F8A" font-size="11">QUANT RESEARCH</text>
    <text class="mono" x="36" y="346" fill="#0F1729" font-size="12">EquityTrace</text></g>
  <text class="mono fade a5" x="20" y="378" fill="#5A6578" font-size="10" letter-spacing="1">inspectable paths · human control</text>
</svg>
