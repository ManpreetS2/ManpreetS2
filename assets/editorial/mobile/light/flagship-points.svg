<svg viewBox="0 0 390 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CareerPilot highlights">
  <style>
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .draw { stroke-dasharray:350; stroke-dashoffset:0; }
    .rise,.fade,.row { opacity:1; }
    @keyframes draw { from { stroke-dashoffset:350; } to { stroke-dashoffset:0; } }
    @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fade { from { opacity:0; } to { opacity:1; } }
    .a1{animation-delay:.1s} .a2{animation-delay:.25s} .a3{animation-delay:.4s}
    .a4{animation-delay:.55s} .a5{animation-delay:.7s} .a6{animation-delay:.85s}
    .r1{animation-delay:.2s} .r2{animation-delay:.35s} .r3{animation-delay:.5s}
    @media (prefers-reduced-motion: no-preference) {
      .draw { animation:draw 1.3s cubic-bezier(.6,0,.2,1) both; }
      .rise { animation:rise .7s cubic-bezier(.2,.7,.2,1) both; }
      .fade { animation:fade .65s ease both; }
      .row { animation:rise .65s cubic-bezier(.2,.7,.2,1) both; }
    }
</style>
  <text class="mono fade a1" x="20" y="18" fill="#5A6578" font-size="11" letter-spacing="2">HIGHLIGHTS</text>
  <g class="row r1 mono">
    <text x="20" y="48" fill="#0B8F8A" font-size="12" letter-spacing="2">01 / FIT</text>
    <text x="20" y="70" fill="#0F1729" font-size="13">Explainable job matching grounded</text>
    <text x="20" y="90" fill="#0F1729" font-size="13">in actual resume and posting evidence.</text>
  </g>
  <line x1="20" y1="106" x2="370" y2="106" stroke="#B0BACC" opacity=".55"/>
  <g class="row r2 mono">
    <text x="20" y="132" fill="#5F4F8F" font-size="12" letter-spacing="2">02 / WORKFLOW</text>
    <text x="20" y="154" fill="#0F1729" font-size="13">Discover, analyze, prepare, and track</text>
    <text x="20" y="174" fill="#0F1729" font-size="13">applications in one workspace.</text>
  </g>
  <line x1="20" y1="190" x2="370" y2="190" stroke="#B0BACC" opacity=".55"/>
  <g class="row r3 mono">
    <text x="20" y="216" fill="#B85040" font-size="12" letter-spacing="2">03 / EXTENSION</text>
    <text x="20" y="238" fill="#0F1729" font-size="13">Human-controlled Chrome assistance</text>
    <text x="20" y="258" fill="#0F1729" font-size="13">for supported job applications.</text>
    <text x="20" y="278" fill="#0F1729" font-size="13">Never automatic submission.</text>
  </g>
</svg>
