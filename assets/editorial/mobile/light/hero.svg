<svg viewBox="0 0 390 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Manpreet Singh">
  <defs><style>
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .sans { font-family:ui-sans-serif,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    
    .draw { stroke-dasharray:340; stroke-dashoffset:0; }
    .rise,.fade,.pop,.row { opacity:1; }
    .flow { stroke-dasharray:3 9; opacity:.35; }
    .pulse { opacity:1; }
    .caret { opacity:1; }
    @keyframes draw { from { stroke-dashoffset:340; } to { stroke-dashoffset:0; } }
    @keyframes rise { from { opacity:0; } to { opacity:1; } }
    @keyframes fade { from { opacity:0; } to { opacity:1; } }
    @keyframes pop { from { opacity:0; } to { opacity:1; } }
    @keyframes march { to { stroke-dashoffset:-12; } }
    @keyframes pulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }
    @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
    .a1{animation-delay:.08s}.a2{animation-delay:.2s}.a3{animation-delay:.35s}
    .a4{animation-delay:.5s}.a5{animation-delay:.65s}.a6{animation-delay:.8s}
    .w1{animation-delay:.15s}.w2{animation-delay:.28s}.w3{animation-delay:.4s}
    .w4{animation-delay:.52s}.w5{animation-delay:.64s}.w6{animation-delay:.76s}
    .p0{animation-delay:.1s}.p1{animation-delay:.45s}.p2{animation-delay:.55s}
    .p3{animation-delay:.65s}.p4{animation-delay:.75s}.p5{animation-delay:.85s}
    .p6{animation-delay:.95s}.p7{animation-delay:1.05s}.p8{animation-delay:1.15s}
    .r1{animation-delay:.05s}.r2{animation-delay:.12s}.r3{animation-delay:.19s}
    .r4{animation-delay:.26s}.r5{animation-delay:.33s}
    @media (prefers-reduced-motion:no-preference) {
      .draw { animation:draw 1.2s cubic-bezier(.6,0,.2,1) both; }
      .rise { animation:rise .65s cubic-bezier(.2,.7,.2,1) both; }
      .fade { animation:fade .55s ease both; }
      .pop { animation:pop .65s cubic-bezier(.2,.7,.2,1) both; }
      .row { animation:rise .5s cubic-bezier(.2,.7,.2,1) both; }
      .flow { animation:march 1.4s linear infinite; }
      .pulse { animation:pulse 2.6s ease-in-out infinite; }
      .caret { animation:blink 1.05s steps(1,end) infinite; }
    }

</style></defs>
  <line class="draw a1" x1="20" y1="40" x2="370" y2="40" stroke="#B8C2D4"/>
  <text class="mono fade a1" x="20" y="28" fill="#4E596E" font-size="11" letter-spacing="2">MS / PORTFOLIO</text>
  <text class="mono fade a2" x="20" y="78" fill="#0B8F8A" font-size="13" letter-spacing="3">HELLO, I'M</text>
  <text class="sans rise a3" x="18" y="130" fill="#0F1729" font-size="36" font-weight="700" letter-spacing="-1.2">Manpreet</text>
  <text class="sans rise a3" x="18" y="176" fill="#0F1729" font-size="36" font-weight="700" letter-spacing="-1.2">Singh</text>
  <text class="mono fade a4" x="20" y="210" fill="#4E596E" font-size="14">Software · AI · Fintech</text>
  <text class="mono fade a5" x="20" y="244" fill="#0F1729" font-size="13">evidence-backed products</text>
  <text class="mono fade a5" x="20" y="266" fill="#0F1729" font-size="13">reliable workflows</text>
  <text class="mono fade a5" x="20" y="288" fill="#0F1729" font-size="13">human-in-the-loop systems</text>
  <!-- compact interest diagram -->
  <line class="draw w1" x1="60" y1="330" x2="195" y2="360" stroke="#B8C2D4"/>
  <line class="draw w2" x1="330" y1="330" x2="195" y2="360" stroke="#B8C2D4"/>
  <line class="draw w3" x1="195" y1="380" x2="195" y2="420" stroke="#0B8F8A"/>
  <g class="pop p1"><rect x="20" y="310" width="80" height="28" rx="2" fill="#F0F4FA" stroke="#0B8F8A" stroke-opacity=".5"/>
    <text class="mono" x="60" y="328" fill="#0F1729" font-size="10" text-anchor="middle">EVIDENCE</text></g>
  <g class="pop p2"><rect x="290" y="310" width="80" height="28" rx="2" fill="#F0F4FA" stroke="#5F4F8F" stroke-opacity=".5"/>
    <text class="mono" x="330" y="328" fill="#0F1729" font-size="10" text-anchor="middle">MODELS</text></g>
  <g class="pop p0"><rect x="145" y="348" width="100" height="32" rx="2" fill="#E4EAF5" stroke="#B8C2D4"/>
    <text class="mono" x="195" y="368" fill="#0F1729" font-size="11" text-anchor="middle">SYSTEMS</text></g>
  <g class="pop p5"><rect x="130" y="420" width="130" height="28" rx="2" fill="#F0F4FA" stroke="#5F4F8F"/>
    <text class="mono" x="195" y="438" fill="#5F4F8F" font-size="10" text-anchor="middle">HUMAN CONTROL</text></g>
  <line class="draw a6" x1="20" y1="468" x2="370" y2="468" stroke="#B8C2D4"/>
  <text class="mono fade a6" x="20" y="492" fill="#0B8F8A" font-size="11" letter-spacing="1">FULL-STACK · AI · FINTECH</text>
  <text class="mono fade a6" x="20" y="512" fill="#6E7890" font-size="11">De Anza → SJSU / 2027 · open to internships</text>
</svg>
