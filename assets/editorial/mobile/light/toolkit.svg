<svg viewBox="0 0 390 286" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Toolkit">
  <style>
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .draw { stroke-dasharray:200; stroke-dashoffset:0; }
    .rise,.fade,.row { opacity:1; }
    @keyframes draw { from { stroke-dashoffset:200; } to { stroke-dashoffset:0; } }
    .a1{animation-delay:.08s} .a2{animation-delay:.16s} .a3{animation-delay:.24s}
    .a4{animation-delay:.32s} .a5{animation-delay:.4s} .a6{animation-delay:.48s}
    .r1{animation-delay:.1s} .r2{animation-delay:.2s} .r3{animation-delay:.3s}
    .r4{animation-delay:.4s} .r5{animation-delay:.5s}
    @media (prefers-reduced-motion: no-preference) {
      .draw { animation:draw 1.1s cubic-bezier(.6,0,.2,1) forwards; }
    }
</style>
  <text class="mono rise a1" x="20" y="28" fill="#3D4A5F" font-size="11" letter-spacing="2">LANGUAGES</text>
  <text class="mono rise a1" x="20" y="50" fill="#0F1729" font-size="13">Python · TypeScript · Java · JS · SQL</text>
  <text class="mono rise a2" x="20" y="84" fill="#3D4A5F" font-size="11" letter-spacing="2">BACKEND</text>
  <text class="mono rise a2" x="20" y="106" fill="#0F1729" font-size="13">FastAPI · Node.js · REST APIs</text>
  <text class="mono rise a3" x="20" y="140" fill="#3D4A5F" font-size="11" letter-spacing="2">FRONTEND</text>
  <text class="mono rise a3" x="20" y="162" fill="#0F1729" font-size="13">React · JavaFX</text>
  <text class="mono rise a4" x="20" y="196" fill="#3D4A5F" font-size="11" letter-spacing="2">DATA</text>
  <text class="mono rise a4" x="20" y="218" fill="#0F1729" font-size="13">PostgreSQL · SQLite · DuckDB</text>
  <text class="mono rise a5" x="20" y="252" fill="#3D4A5F" font-size="11" letter-spacing="2">TOOLING</text>
  <text class="mono rise a5" x="20" y="274" fill="#0F1729" font-size="13">Git · Docker · Actions · pytest · Vitest · JUnit</text>
</svg>
