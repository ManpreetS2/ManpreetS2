<svg viewBox="0 0 390 492" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="About Manpreet Singh">
  <style>
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .rise { opacity:1; }
    @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.2s} .a3{animation-delay:.35s}
    .a4{animation-delay:.5s} .a5{animation-delay:.65s} .a6{animation-delay:.8s}
    @media (prefers-reduced-motion: no-preference) {
      .rise { animation:rise .7s cubic-bezier(.2,.7,.2,1) both; }
    }
</style>

  <text class="mono rise a1" x="20" y="28" font-size="14" fill="#0F1729">Building end-to-end software,</text>
  <text class="mono rise a1" x="20" y="48" font-size="14" fill="#0F1729">from backend systems to</text>
  <text class="mono rise a1" x="20" y="68" font-size="14" fill="#0F1729">user-facing products.</text>
  <text class="mono rise a2" x="20" y="100" font-size="13" fill="#0F1729">My projects span career tools,</text>
  <text class="mono rise a2" x="20" y="120" font-size="13" fill="#0F1729">AI experimentation, and</text>
  <text class="mono rise a2" x="20" y="140" font-size="13" fill="#0F1729">financial research.</text>
  <text class="mono rise a3" x="20" y="172" font-size="13" fill="#1A2438">I care about clear interfaces,</text>
  <text class="mono rise a3" x="20" y="192" font-size="13" fill="#1A2438">reliable systems, and results</text>
  <text class="mono rise a3" x="20" y="212" font-size="13" fill="#1A2438">I can explain.</text>

  <line class="rise a4" x1="20" y1="236" x2="370" y2="236" stroke="#B0BACC" stroke-width="1" opacity=".5"/>

  <text class="mono rise a4" x="20" y="268" font-size="11" fill="#3D4A5F" letter-spacing="2.5">FOCUS</text>
  <text class="mono rise a4" x="20" y="290" font-size="13" fill="#0F1729">Full-stack engineering · Applied AI</text>
  <text class="mono rise a4" x="20" y="310" font-size="13" fill="#0F1729">Quantitative research</text>

  <text class="mono rise a5" x="20" y="346" font-size="11" fill="#3D4A5F" letter-spacing="2.5">STATUS</text>
  <text class="mono rise a5" x="20" y="368" font-size="13" fill="#0B8F8A">Seeking software engineering and</text>
  <text class="mono rise a5" x="20" y="388" font-size="13" fill="#0B8F8A">solutions engineering internships</text>

  <text class="mono rise a6" x="20" y="424" font-size="11" fill="#3D4A5F" letter-spacing="2.5">EDUCATION</text>
  <text class="mono rise a6" x="20" y="446" font-size="13" fill="#0F1729">Computer Science · De Anza College</text>
  <text class="mono rise a6" x="20" y="466" font-size="13" fill="#0F1729">→ SJSU (Spring 2027)</text>
</svg>
