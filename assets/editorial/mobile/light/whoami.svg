<svg viewBox="0 0 390 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="About Manpreet Singh">
  <style>
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .rise { opacity:1; }
    @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.2s} .a3{animation-delay:.35s}
    .a4{animation-delay:.5s} .a5{animation-delay:.65s} .a6{animation-delay:.8s}
    @media (prefers-reduced-motion: no-preference) {
      .rise { animation:rise .7s cubic-bezier(.2,.7,.2,1) both; }
    }
</style>

  <text class="mono rise a1" x="20" y="28" font-size="14" fill="#0F1729">CS student at De Anza College,</text>
  <text class="mono rise a1" x="20" y="48" font-size="14" fill="#0F1729">incoming SJSU, Spring 2027.</text>
  <text class="mono rise a2" x="20" y="80" font-size="13" fill="#0F1729">building software, AI-assisted</text>
  <text class="mono rise a2" x="20" y="100" font-size="13" fill="#0F1729">products, and fintech research tools.</text>
  <text class="mono rise a3" x="20" y="132" font-size="13" fill="#3D4A5F">inspectable data paths.</text>
  <text class="mono rise a3" x="20" y="152" font-size="13" fill="#3D4A5F">honest interfaces.</text>

  <line class="rise a4" x1="20" y1="176" x2="370" y2="176" stroke="#B0BACC" stroke-width="1" opacity=".5"/>

  <text class="mono rise a4" x="20" y="208" font-size="11" fill="#3D4A5F" letter-spacing="2.5">FOCUS</text>
  <text class="mono rise a4" x="20" y="230" font-size="13" fill="#0F1729">Product systems · Applied ML</text>
  <text class="mono rise a4" x="20" y="250" font-size="13" fill="#0F1729">Markets &amp; research software</text>

  <text class="mono rise a5" x="20" y="286" font-size="11" fill="#3D4A5F" letter-spacing="2.5">STATUS</text>
  <text class="mono rise a5" x="20" y="308" font-size="13" fill="#0B8F8A">looking for teams that ship</text>
  <text class="mono rise a5" x="20" y="328" font-size="13" fill="#0B8F8A">careful, inspectable software</text>

  <text class="mono rise a6" x="20" y="364" font-size="11" fill="#3D4A5F" letter-spacing="2.5">EDUCATION</text>
  <text class="mono rise a6" x="20" y="386" font-size="13" fill="#0F1729">CS — De Anza, then SJSU (2027)</text>
</svg>
