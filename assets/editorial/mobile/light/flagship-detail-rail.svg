<svg viewBox="0 0 390 70" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CareerPilot detail views">
  <style>
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .draw { stroke-dasharray:350; stroke-dashoffset:0; }
    .rise,.fade,.row { opacity:1; }
    @keyframes draw { from { stroke-dashoffset:350; } to { stroke-dashoffset:0; } }
    .a1{animation-delay:.08s} .a2{animation-delay:.16s} .a3{animation-delay:.24s}
    .a4{animation-delay:.32s} .a5{animation-delay:.4s} .a6{animation-delay:.48s}
    .r1{animation-delay:.1s} .r2{animation-delay:.2s} .r3{animation-delay:.3s}
    .r4{animation-delay:.4s} .r5{animation-delay:.5s}
    @media (prefers-reduced-motion: no-preference) {
      .draw { animation:draw 1.1s cubic-bezier(.6,0,.2,1) forwards; }
    }
</style>
  <text class="mono fade a1" x="20" y="20" fill="#3D4A5F" font-size="11" letter-spacing="2">ENGINEERING DETAIL</text>
  <text class="mono fade a1" x="20" y="38" fill="#5A6578" font-size="11">Two real product views · not mocks</text>
  <line class="draw a1" x1="20" y1="50" x2="370" y2="50" stroke="#B0BACC" stroke-width="1"/>
  <text class="mono fade a2" x="20" y="66" fill="#0B8F8A" font-size="11" letter-spacing="1.5">01 EVIDENCE · 02 PREPARE</text>
</svg>
