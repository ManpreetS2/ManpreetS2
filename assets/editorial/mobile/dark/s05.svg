<svg viewBox="0 0 390 72" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Section 05">
  <style>
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .draw { stroke-dasharray:300; stroke-dashoffset:0; }
    .f { opacity:1; }
    @keyframes d { from { stroke-dashoffset:300; } to { stroke-dashoffset:0; } }
    @keyframes f { from { opacity:0; } to { opacity:1; } }
    @media (prefers-reduced-motion: no-preference) {
      .draw { animation:d 1.1s cubic-bezier(.6,0,.2,1) .15s both; }
      .f { animation:f .7s ease .1s both; }
    }
  </style>
  <g class="f mono">
    <text x="20" y="52" font-size="36" fill="#A8B8CC">05</text>
    <text x="78" y="42" font-size="13" fill="#3DDBD9" letter-spacing="3">TOOLKIT</text>
    <text x="370" y="42" font-size="10" fill="#C5CEDC" text-anchor="end">~/05</text>
  </g>
  <line class="draw" x1="78" y1="54" x2="300" y2="54" stroke="#5A7190" stroke-width="1"/>
</svg>
