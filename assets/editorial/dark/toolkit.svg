<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" fill="none" role="img" aria-label="Toolkit accent">
  <defs><style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: ui-sans-serif, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .pulse { opacity: 1; }
    @keyframes pulse {
      0%,100% { opacity: .55; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
    }
</style></defs>
  <line x1="48" y1="20" x2="1152" y2="20" stroke="#3A4F6C" stroke-width="1"/>
  <g class="mono">
    <text x="48" y="48" fill="#7B879C" font-size="15" letter-spacing="2.2">LANGUAGES</text>
    <text x="220" y="48" fill="#3A4F6C" font-size="15">·</text>
    <text x="250" y="48" fill="#7B879C" font-size="15" letter-spacing="2.2">FRAMEWORKS</text>
    <text x="450" y="48" fill="#3A4F6C" font-size="15">·</text>
    <text x="480" y="48" fill="#7B879C" font-size="15" letter-spacing="2.2">DATA</text>
    <text x="580" y="48" fill="#3A4F6C" font-size="15">·</text>
    <text x="610" y="48" fill="#7B879C" font-size="15" letter-spacing="2.2">TOOLING</text>
    <text x="1152" y="48" fill="#3DDBD9" font-size="14" letter-spacing="2" text-anchor="end">PRACTICAL STACK</text>
  </g>
</svg>
<!-- mode:dark -->
