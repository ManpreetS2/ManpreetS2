    <text class="sans" x="48" y="82" fill="#E8EEF8" font-size="36" font-weight="700" letter-spacing="-0.8">Evidence-driven job search workspace</text>
    <text class="mono" x="48" y="118" fill="#9AA6BB" font-size="17">Python · FastAPI · React · TypeScript · SQLite · Chrome Extension</text>
    <text class="mono" x="1152" y="34" fill="#B8A9E8" font-size="14" letter-spacing="2" text-anchor="end">LOCAL / SELF-HOSTABLE</text>
  </g>
  <line x1="48" y1="140" x2="1152" y2="140" stroke="#3A4F6C" stroke-width="1.25"/>
