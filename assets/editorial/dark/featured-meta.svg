<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" fill="none" role="img" aria-label="CareerPilot featured project meta">
  <defs><style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: ui-sans-serif, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .pulse { opacity: 1; }
    @keyframes pulse {
      0%,100% { opacity: .55; }
