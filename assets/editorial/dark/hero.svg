<svg viewBox="0 0 1000 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Manpreet Singh — software engineering, AI systems, fintech">
  <style>
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .draw { stroke-dasharray:1000; stroke-dashoffset:0; }
    .rise,.fade { opacity:1; }
    @keyframes draw { from { stroke-dashoffset:1000; } to { stroke-dashoffset:0; } }
    @keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fade { from { opacity:0; } to { opacity:1; } }
    .a1{animation-delay:.2s} .a2{animation-delay:.5s} .a3{animation-delay:.9s}
    .a4{animation-delay:1.2s} .a5{animation-delay:1.4s} .a6{animation-delay:1.7s}
    @media (prefers-reduced-motion: no-preference) {
      .draw { animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
      .rise { animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
      .fade { animation:fade .7s ease forwards; }
    }
</style>

  <line class="draw a1" x1="48" y1="58" x2="952" y2="58" stroke="#5A7190" stroke-width="1"/>
  <g class="fade a1">
    <text class="mono" fill="#C5CEDC" x="48" y="44" font-size="11" letter-spacing="3.5">PORTFOLIO — INDEX Nº 001</text>
    <text class="mono" fill="#C5CEDC" x="952" y="44" font-size="11" letter-spacing="3.5" text-anchor="end">BAY AREA, CA</text>
  </g>

  <g class="rise a2">
    <text fill="#F4F7FC" class="mono" x="46" y="176" font-size="72" letter-spacing="-2">Manpreet Singh</text>
  </g>
  <g class="fade a3">
    <text fill="#EDF1F8" class="mono" x="48" y="214" font-size="19">Software Engineering · AI Systems · Fintech</text>
  </g>

  <g class="fade a4">
    <text fill="#A8B4C6" class="mono" x="48" y="274" font-size="12.5" letter-spacing="1">focus  ▸</text>
    <text fill="#3DDBD9" class="mono" x="128" y="274" font-size="12.5" letter-spacing="1">evidence-first products · reliable backends · reproducible research</text>
  </g>
  <g class="fade a5">
    <text fill="#A8B4C6" class="mono" x="48" y="300" font-size="12.5" letter-spacing="1">open to software engineering and solutions engineering internships</text>
  </g>

  <line class="draw a5" x1="48" y1="342" x2="952" y2="342" stroke="#5A7190" stroke-width="1"/>
  <g class="fade a6">
    <text fill="#3DDBD9" class="mono" x="48" y="374" font-size="11.5" letter-spacing="3">BUILD</text>
    <text fill="#B8A9E8" class="mono" x="128" y="374" font-size="11.5">·</text>
    <text fill="#B8A9E8" class="mono" x="152" y="374" font-size="11.5" letter-spacing="3">TEST</text>
    <text fill="#E08A7A" class="mono" x="228" y="374" font-size="11.5">·</text>
    <text fill="#E08A7A" class="mono" x="252" y="374" font-size="11.5" letter-spacing="3">SHIP</text>
    <text fill="#C5CEDC" class="mono" x="952" y="374" font-size="11.5" letter-spacing="3" text-anchor="end">DE ANZA → SJSU / 2027</text>
  </g>
</svg>
