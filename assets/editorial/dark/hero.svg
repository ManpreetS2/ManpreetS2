<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Manpreet Singh — software engineering, AI systems, and fintech</title>
  <desc id="desc">Animated editorial hero for Manpreet Singh's developer portfolio.</desc>
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DDBD9"/>
      <stop offset=".55" stop-color="#B8A9E8"/>
      <stop offset="1" stop-color="#E08A7A"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="28%" r="48%">
      <stop offset="0" stop-color="#3DDBD9" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#B8A9E8" stop-opacity=".08"/>
      <stop offset="1" stop-color="#3DDBD9" stop-opacity="0"/>
    </radialGradient>
    <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: ui-sans-serif, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 0; }
    .rise,.lift,.fade { opacity: 1; }
    .pulse,.caret { opacity: 1; }
    .travel { stroke-dasharray: 5 9; }
    @keyframes draw {
      from { stroke-dashoffset: 1200; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes rise {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes lift {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes pulse {
      0%,100% { opacity: .55; }
      50% { opacity: 1; }
    }
    @keyframes travel { to { stroke-dashoffset: -280; } }
    @keyframes blink {
      0%,49% { opacity: 1; }
      50%,100% { opacity: 0; }
    }
    .a1{animation-delay:.05s} .a2{animation-delay:.15s} .a3{animation-delay:.28s}
    .a4{animation-delay:.4s} .a5{animation-delay:.52s} .a6{animation-delay:.64s}
    .d1{animation-delay:.5s} .d2{animation-delay:.95s} .d3{animation-delay:1.4s}
    @media (prefers-reduced-motion: no-preference) {
      .draw { animation: draw 1.1s cubic-bezier(.6,0,.2,1) both; }
      .rise { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
      .lift { animation: lift .65s cubic-bezier(.2,.7,.2,1) both; }
      .fade { animation: fade .5s ease both; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      .travel { animation: travel 18s linear infinite; }
      .caret { animation: blink 1.05s steps(1,end) infinite; }
    }
</style>
  </defs>

  <rect width="1200" height="560" fill="transparent"/>
  <ellipse cx="860" cy="150" rx="380" ry="220" fill="url(#glow)"/>

  <line class="draw a1" x1="48" y1="58" x2="1152" y2="58" stroke="#3A4F6C" stroke-width="1.25"/>
  <g class="fade a1 mono">
    <text x="48" y="40" fill="#9AA6BB" font-size="18" letter-spacing="3.4">MS / ENGINEERING PORTFOLIO</text>
    <text x="1152" y="40" fill="#9AA6BB" font-size="18" letter-spacing="3.4" text-anchor="end">EST. IN CURIOSITY</text>
  </g>

  <g class="fade a2 mono">
    <text x="48" y="118" fill="#3DDBD9" font-size="20" letter-spacing="5">HELLO, I'M</text>
  </g>
  <g class="lift a3">
    <text class="sans" x="44" y="198" fill="#E8EEF8" font-size="86" font-weight="700" letter-spacing="-3.2">MANPREET</text>
    <text class="sans" x="44" y="288" fill="url(#nameGrad)" font-size="86" font-weight="700" letter-spacing="-3.2">SINGH</text>
    <rect class="caret" x="368" y="232" width="5" height="56" rx="1.5" fill="#3DDBD9"/>
  </g>

  <g class="fade a4 mono">
    <text x="48" y="334" fill="#9AA6BB" font-size="22">Software · AI systems · Fintech tooling</text>
  </g>

  <!-- Full-width signal strip (stacks cleanly on narrow viewports) -->
  <g class="fade a5" transform="translate(48 360)">
    <rect x="0" y="0" width="1104" height="118" rx="8" fill="#121E33" stroke="#3A4F6C" stroke-width="1"/>
    <text class="mono" x="28" y="32" fill="#7B879C" font-size="14" letter-spacing="2.4">SYSTEM TRACE / 001</text>
    <path class="travel" d="M40 72 H210 M320 72 H490 M600 72 H770" stroke="#3DDBD9" stroke-width="1.8" fill="none" opacity=".85"/>
    <g class="pulse">
      <rect x="28" y="50" width="168" height="48" rx="6" fill="#152238" stroke="#3DDBD9" stroke-opacity=".5"/>
      <text class="mono" x="44" y="70" fill="#3DDBD9" font-size="12" letter-spacing="1.2">01 INPUT</text>
      <text class="mono" x="44" y="90" fill="#E8EEF8" font-size="16" font-weight="600">observe</text>
    </g>
    <g class="pulse d1">
      <rect x="308" y="50" width="168" height="48" rx="6" fill="#152238" stroke="#B8A9E8" stroke-opacity=".55"/>
      <text class="mono" x="324" y="70" fill="#B8A9E8" font-size="12" letter-spacing="1.2">02 VERIFY</text>
      <text class="mono" x="324" y="90" fill="#E8EEF8" font-size="16" font-weight="600">ground</text>
    </g>
    <g class="pulse d2">
      <rect x="588" y="50" width="168" height="48" rx="6" fill="#152238" stroke="#E08A7A" stroke-opacity=".5"/>
      <text class="mono" x="604" y="70" fill="#E08A7A" font-size="12" letter-spacing="1.2">03 OUTPUT</text>
      <text class="mono" x="604" y="90" fill="#E8EEF8" font-size="16" font-weight="600">deliver</text>
    </g>
    <circle class="pulse d3" cx="860" cy="74" r="6" fill="#3DDBD9"/>
    <text class="mono" x="878" y="80" fill="#E8EEF8" font-size="16">traceable state · local-first</text>
  </g>

  <line class="draw a6" x1="48" y1="508" x2="1152" y2="508" stroke="#3A4F6C" stroke-width="1.25"/>
  <g class="fade a6 mono">
    <text x="48" y="540" fill="#9AA6BB" font-size="16" letter-spacing="1.4">DE ANZA COLLEGE → SAN JOSÉ STATE UNIVERSITY / SPRING 2027</text>
    <text x="1152" y="540" fill="#9AA6BB" font-size="16" letter-spacing="1.4" text-anchor="end">github.com/ManpreetS2</text>
  </g>
</svg>
<!-- mode:dark -->
