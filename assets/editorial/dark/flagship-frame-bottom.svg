<svg viewBox="0 0 1000 88" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CareerPilot screenshot frame bottom">
  <style>
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .draw { stroke-dasharray:904; stroke-dashoffset:0; }
    .rise,.fade,.row { opacity:1; }
    @keyframes draw { from { stroke-dashoffset:904; } to { stroke-dashoffset:0; } }
    .a1{animation-delay:.08s} .a2{animation-delay:.16s} .a3{animation-delay:.24s}
    .a4{animation-delay:.32s} .a5{animation-delay:.4s} .a6{animation-delay:.48s}
    .r1{animation-delay:.1s} .r2{animation-delay:.2s} .r3{animation-delay:.3s}
    .r4{animation-delay:.4s} .r5{animation-delay:.5s}
    @media (prefers-reduced-motion: no-preference) {
      .draw { animation:draw 1.1s cubic-bezier(.6,0,.2,1) forwards; }
    }
</style>
  <!-- Extra empty air under screenshot before rails (matches WHOAMI row breathing room) -->
  <line class="draw a1" x1="72" y1="40" x2="928" y2="40" stroke="#5A7190" stroke-width="1"/>
  <path class="fade a1" d="M48 40 V56 H64" stroke="#3DDBD9" stroke-width="1.25" fill="none"/>
  <path class="fade a1" d="M952 40 V56 H936" stroke="#3DDBD9" stroke-width="1.25" fill="none"/>
  <text class="mono fade a2" x="48" y="76" fill="#C5CEDC" font-size="11" letter-spacing="2.5">HUMAN CONTROLLED · NEVER AUTO-SUBMIT</text>
  <text class="mono fade a2" x="952" y="76" fill="#E08A7A" font-size="11" letter-spacing="2" text-anchor="end">SOURCE VISIBLE</text>
</svg>
