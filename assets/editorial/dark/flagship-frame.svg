<svg viewBox="0 0 1000 40" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CareerPilot screenshot frame top">
  <style>
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .draw { stroke-dasharray:904; stroke-dashoffset:0; }
    .rise,.fade,.row { opacity:1; }
    @keyframes draw { from { stroke-dashoffset:904; } to { stroke-dashoffset:0; } }
    .a1{animation-delay:.08s} .a2{animation-delay:.16s} .a3{animation-delay:.24s}
    .a4{animation-delay:.32s} .a5{animation-delay:.4s} .a6{animation-delay:.48s}
    .r1{animation-delay:.1s} .r2{animation-delay:.2s} .r3{animation-delay:.3s}
    .r4{animation-delay:.4s} .r5{animation-delay:.5s}
    @media (prefers-reduced-motion: no-preference) {
      .draw { animation:draw 1.1s cubic-bezier(.6,0,.2,1) forwards; }
    }
</style>
  <!-- Corner ticks align screenshot to the editorial grid -->
  <path class="fade a1" d="M48 28 V12 H64" stroke="#3DDBD9" stroke-width="1.25" fill="none"/>
  <path class="fade a1" d="M952 28 V12 H936" stroke="#3DDBD9" stroke-width="1.25" fill="none"/>
  <line class="draw a1" x1="72" y1="12" x2="928" y2="12" stroke="#5A7190" stroke-width="1"/>
  <text class="mono fade a2" x="48" y="36" fill="#A8B4C6" font-size="11" letter-spacing="2.5">LIVE UI — DISCOVER</text>
  <text class="mono fade a2" x="952" y="36" fill="#C5CEDC" font-size="11" letter-spacing="2" text-anchor="end">REAL PRODUCT SCREENSHOT</text>
</svg>
