<svg viewBox="0 0 1000 282" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CareerPilot engineering highlights">
  <style>
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .draw { stroke-dasharray:904; stroke-dashoffset:0; }
    .rise,.fade,.row { opacity:1; }
    @keyframes draw { from { stroke-dashoffset:904; } to { stroke-dashoffset:0; } }
    @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fade { from { opacity:0; } to { opacity:1; } }
    .a1{animation-delay:.1s} .a2{animation-delay:.25s} .a3{animation-delay:.4s}
    .a4{animation-delay:.55s} .a5{animation-delay:.7s} .a6{animation-delay:.85s}
    .r1{animation-delay:.2s} .r2{animation-delay:.35s} .r3{animation-delay:.5s}
    @media (prefers-reduced-motion: no-preference) {
      .draw { animation:draw 1.3s cubic-bezier(.6,0,.2,1) both; }
      .rise { animation:rise .7s cubic-bezier(.2,.7,.2,1) both; }
      .fade { animation:fade .65s ease both; }
      .row { animation:rise .65s cubic-bezier(.2,.7,.2,1) both; }
    }
</style>
  <text class="mono fade a1" x="48" y="18" fill="#A8B4C6" font-size="11" letter-spacing="3">THREE ENGINEERING HIGHLIGHTS</text>
  <g class="row r1 mono">
    <text x="48" y="36" fill="#3DDBD9" font-size="12" letter-spacing="2.5">01 / FIT</text><text x="48" y="58" fill="#F4F7FC" font-size="15">Explainable job matching grounded in actual resume and job-posting evidence.</text>
    <line x1="48" y1="80" x2="952" y2="80" stroke="#5A7190" stroke-width="1" opacity=".55"/>
  </g><g class="row r2 mono">
    <text x="48" y="108" fill="#B8A9E8" font-size="12" letter-spacing="2.5">02 / WORKFLOW</text><text x="48" y="130" fill="#F4F7FC" font-size="15">Discover, analyze, prepare, and track applications in one workspace.</text>
    <line x1="48" y1="152" x2="952" y2="152" stroke="#5A7190" stroke-width="1" opacity=".55"/>
  </g><g class="row r3 mono">
    <text x="48" y="180" fill="#E08A7A" font-size="12" letter-spacing="2.5">03 / EXTENSION</text><text x="48" y="202" fill="#F4F7FC" font-size="15">Human-controlled Chrome assistance for supported job applications.</text><text x="48" y="224" fill="#F4F7FC" font-size="15">Never automatic submission.</text>
    <line x1="48" y1="246" x2="952" y2="246" stroke="#5A7190" stroke-width="1" opacity=".55"/>
  </g>
</svg>
