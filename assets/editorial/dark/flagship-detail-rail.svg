<svg viewBox="0 0 1000 56" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CareerPilot engineering detail views">
  <style>
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .draw { stroke-dasharray:904; stroke-dashoffset:0; }
    .rise,.fade,.row { opacity:1; }
    @keyframes draw { from { stroke-dashoffset:904; } to { stroke-dashoffset:0; } }
    .a1{animation-delay:.08s} .a2{animation-delay:.16s} .a3{animation-delay:.24s}
    .a4{animation-delay:.32s} .a5{animation-delay:.4s} .a6{animation-delay:.48s}
    .r1{animation-delay:.1s} .r2{animation-delay:.2s} .r3{animation-delay:.3s}
    .r4{animation-delay:.4s} .r5{animation-delay:.5s}
    @media (prefers-reduced-motion: no-preference) {
      .draw { animation:draw 1.1s cubic-bezier(.6,0,.2,1) forwards; }
    }
</style>
  <text class="mono fade a1" x="48" y="22" fill="#C5CEDC" font-size="11" letter-spacing="3">ENGINEERING DETAIL · TWO REAL VIEWS</text>
  <text class="mono fade a1" x="952" y="22" fill="#A8B4C6" font-size="11" letter-spacing="2" text-anchor="end">NOT MOCKS</text>
  <line class="draw a1" x1="48" y1="36" x2="952" y2="36" stroke="#5A7190" stroke-width="1"/>
  <text class="mono fade a2" x="48" y="52" fill="#3DDBD9" font-size="11" letter-spacing="2">01 / MATCH EVIDENCE</text>
  <text class="mono fade a2" x="520" y="52" fill="#B8A9E8" font-size="11" letter-spacing="2">02 / PREPARE</text>
</svg>
