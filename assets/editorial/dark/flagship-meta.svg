<svg viewBox="0 0 1000 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CareerPilot flagship meta">
  <defs><style>
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .sans { font-family:ui-sans-serif,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    
    .draw { stroke-dasharray:1000; stroke-dashoffset:0; }
    .rise,.fade,.pop,.row { opacity:1; }
    .flow { stroke-dasharray:3 9; opacity:.35; }
    .pulse { opacity:1; }
    .caret { opacity:1; }
    @keyframes draw { from { stroke-dashoffset:1000; } to { stroke-dashoffset:0; } }
    @keyframes rise { from { opacity:0; } to { opacity:1; } }
    @keyframes fade { from { opacity:0; } to { opacity:1; } }
    @keyframes pop { from { opacity:0; } to { opacity:1; } }
    @keyframes march { to { stroke-dashoffset:-12; } }
    @keyframes pulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }
    @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
    .a1{animation-delay:.08s}.a2{animation-delay:.2s}.a3{animation-delay:.35s}
    .a4{animation-delay:.5s}.a5{animation-delay:.65s}.a6{animation-delay:.8s}
    .w1{animation-delay:.15s}.w2{animation-delay:.28s}.w3{animation-delay:.4s}
    .w4{animation-delay:.52s}.w5{animation-delay:.64s}.w6{animation-delay:.76s}
    .p0{animation-delay:.1s}.p1{animation-delay:.45s}.p2{animation-delay:.55s}
    .p3{animation-delay:.65s}.p4{animation-delay:.75s}.p5{animation-delay:.85s}
    .p6{animation-delay:.95s}.p7{animation-delay:1.05s}.p8{animation-delay:1.15s}
    .r1{animation-delay:.05s}.r2{animation-delay:.12s}.r3{animation-delay:.19s}
    .r4{animation-delay:.26s}.r5{animation-delay:.33s}
    @media (prefers-reduced-motion:no-preference) {
      .draw { animation:draw 1.2s cubic-bezier(.6,0,.2,1) both; }
      .rise { animation:rise .65s cubic-bezier(.2,.7,.2,1) both; }
      .fade { animation:fade .55s ease both; }
      .pop { animation:pop .65s cubic-bezier(.2,.7,.2,1) both; }
      .row { animation:rise .5s cubic-bezier(.2,.7,.2,1) both; }
      .flow { animation:march 1.4s linear infinite; }
      .pulse { animation:pulse 2.6s ease-in-out infinite; }
      .caret { animation:blink 1.05s steps(1,end) infinite; }
    }

</style></defs>
  <line class="draw a1" x1="48" y1="28" x2="952" y2="28" stroke="#3A4F6C" stroke-width="1"/>
  <text class="mono fade a1" x="48" y="18" fill="#3DDBD9" font-size="12" letter-spacing="3.2">FLAGSHIP · CAREERPILOT</text>
  <text class="mono fade a1" x="952" y="18" fill="#B8A9E8" font-size="11" letter-spacing="2" text-anchor="end">LOCAL / SELF-HOSTABLE</text>
  <text class="sans rise a2" x="48" y="78" fill="#E8EEF8" font-size="36" font-weight="700" letter-spacing="-1">Evidence-driven job search</text>
  <text class="sans rise a2" x="48" y="118" fill="#E8EEF8" font-size="36" font-weight="700" letter-spacing="-1">workspace</text>
  <text class="mono fade a3" x="48" y="152" fill="#8A96AB" font-size="14">Python · FastAPI · React · TypeScript · SQLite · Chrome Extension</text>
  <text class="mono fade a4" x="48" y="178" fill="#6A768C" font-size="12">Grounded profiles · deterministic Fit · human-approved applications</text>
  <g class="fade a4 mono">
    <text x="700" y="78" fill="#6A768C" font-size="10" letter-spacing="2">STACK TRACE</text>
    <text x="700" y="102" fill="#3DDBD9" font-size="12">01  Fit engine</text>
    <text x="700" y="124" fill="#B8A9E8" font-size="12">02  Search workflow</text>
    <text x="700" y="146" fill="#E08A7A" font-size="12">03  Chrome assist</text>
  </g>
  <line class="draw a4" x1="48" y1="192" x2="952" y2="192" stroke="#3A4F6C" stroke-width="1"/>
</svg>
