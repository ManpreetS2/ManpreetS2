<svg viewBox="0 0 1000 622" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Selected projects directory">
  <style>
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .draw { stroke-dasharray:904; stroke-dashoffset:0; }
    .rise,.fade,.row { opacity:1; }
    @keyframes draw { from { stroke-dashoffset:904; } to { stroke-dashoffset:0; } }
    @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fade { from { opacity:0; } to { opacity:1; } }
    .a1{animation-delay:.1s} .a2{animation-delay:.25s} .a3{animation-delay:.4s}
    .a4{animation-delay:.55s} .a5{animation-delay:.7s} .a6{animation-delay:.85s}
    .r1{animation-delay:.2s} .r2{animation-delay:.35s} .r3{animation-delay:.5s}
    @media (prefers-reduced-motion: no-preference) {
      .draw { animation:draw 1.3s cubic-bezier(.6,0,.2,1) both; }
      .rise { animation:rise .7s cubic-bezier(.2,.7,.2,1) both; }
      .fade { animation:fade .65s ease both; }
      .row { animation:rise .65s cubic-bezier(.2,.7,.2,1) both; }
    }
</style>
  <g class="row r1 mono"><text x="48" y="38" fill="#F4F7FC" font-size="16" letter-spacing=".5">01 / INTEGRATIONLAB</text><text x="952" y="38" fill="#A8B4C6" font-size="10" letter-spacing="1.5" text-anchor="end">PRODUCT SCREENSHOT</text><text x="48" y="64" fill="#C5CEDC" font-size="14">Self-hosted console for understanding API and webhook failures</text><text x="48" y="86" fill="#C5CEDC" font-size="14">through recorded evidence, retry handling, and auditable observations.</text><text x="48" y="114" fill="#3DDBD9" font-size="12" letter-spacing=".3">FASTAPI · POSTGRESQL · REACT · DOCKER</text><line x1="48" y1="136" x2="952" y2="136" stroke="#5A7190" stroke-width="1"/></g><g class="row r2 mono"><text x="48" y="176" fill="#F4F7FC" font-size="16" letter-spacing=".5">02 / R.E.A.C.T.</text><text x="952" y="176" fill="#A8B4C6" font-size="10" letter-spacing="1.5" text-anchor="end">ILLUSTRATIVE ART</text><text x="48" y="202" fill="#C5CEDC" font-size="14">Research infrastructure for comparing language-model controller</text><text x="48" y="224" fill="#C5CEDC" font-size="14">revisions with and without numerical reward feedback.</text><text x="48" y="252" fill="#B8A9E8" font-size="12" letter-spacing=".3">PYTHON · SIMULATION · RESEARCH PROTOTYPE</text><line x1="48" y1="274" x2="952" y2="274" stroke="#5A7190" stroke-width="1"/></g><g class="row r3 mono"><text x="48" y="314" fill="#F4F7FC" font-size="16" letter-spacing=".5">03 / EQUITYTRACE</text><text x="952" y="314" fill="#A8B4C6" font-size="10" letter-spacing="1.5" text-anchor="end">ILLUSTRATIVE ART</text><text x="48" y="340" fill="#C5CEDC" font-size="14">Point-in-time financial research based on SEC filings,</text><text x="48" y="362" fill="#C5CEDC" font-size="14">transparent factors, and reproducible backtesting.</text><text x="48" y="390" fill="#3DDBD9" font-size="12" letter-spacing=".3">PYTHON · SEC XBRL · DUCKDB</text><line x1="48" y1="412" x2="952" y2="412" stroke="#5A7190" stroke-width="1"/></g><g class="row r4 mono"><text x="48" y="452" fill="#F4F7FC" font-size="16" letter-spacing=".5">04 / MINECRAFT AI CIVILIZATION</text><text x="952" y="452" fill="#A8B4C6" font-size="10" letter-spacing="1.5" text-anchor="end">ILLUSTRATIVE ART · IN DEVELOPMENT</text><text x="48" y="478" fill="#C5CEDC" font-size="14">Multi-agent research prototype exploring persistent identities,</text><text x="48" y="500" fill="#C5CEDC" font-size="14">memories, planning, and real actions in a shared Minecraft world.</text><text x="48" y="522" fill="#C5CEDC" font-size="14">Complete autonomous multi-agent simulation still under development.</text><text x="48" y="550" fill="#E08A7A" font-size="12" letter-spacing=".3">TYPESCRIPT · MINEFLAYER · SQLITE</text><line x1="48" y1="572" x2="952" y2="572" stroke="#5A7190" stroke-width="1"/></g>
  <text class="mono fade a5" x="48" y="614" fill="#A8B4C6" font-size="12" letter-spacing="1.2">ALSO — StrikeCaller · PagePulse · Java Banking System · System Down Simulator</text>
</svg>
