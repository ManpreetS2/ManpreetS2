  <g class="row r1 mono"><text x="48" y="38" fill="#F4F7FC" font-size="16" letter-spacing=".5">01 / INTEGRATIONLAB</text><text x="780" y="30" fill="#A8B4C6" font-size="9" letter-spacing="1.2" text-anchor="end">PRODUCT</text><text x="48" y="64" fill="#C5CEDC" font-size="14">Self-hosted console for understanding API and webhook failures</text><text x="48" y="86" fill="#C5CEDC" font-size="14">through recorded evidence, retry handling, and auditable observations.</text><text x="48" y="114" fill="#3DDBD9" font-size="12" letter-spacing=".3">FASTAPI · POSTGRESQL · REACT · DOCKER</text><rect x="804" y="34" width="148" height="72" fill="none" stroke="#5A7190" stroke-width="1"/>
