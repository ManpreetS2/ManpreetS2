    <line class="flow" x1="580" y1="248" x2="755" y2="166" stroke="#B8A9E8"/>
    <line class="flow" x1="420" y1="312" x2="245" y2="380" stroke="#E08A7A"/>
    <line class="flow" x1="580" y1="312" x2="755" y2="380" stroke="#3DDBD9"/>
