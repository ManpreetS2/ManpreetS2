  <text class="mono pop p1" x="200" y="92" fill="#3DDBD9" font-size="10" letter-spacing="2.5" text-anchor="middle">FULL-STACK PRODUCTS</text>
  <text class="mono pop p2" x="800" y="92" fill="#B8A9E8" font-size="10" letter-spacing="2.5" text-anchor="middle">AI EXPERIMENTATION</text>
  <text class="mono pop p3" x="200" y="548" fill="#E08A7A" font-size="10" letter-spacing="2.5" text-anchor="middle">RELIABLE INTEGRATIONS</text>
