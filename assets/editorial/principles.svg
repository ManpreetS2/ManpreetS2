<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="224" viewBox="0 0 1200 224" role="img" aria-labelledby="title desc">
<title id="title">My engineering approach — evidence, reliable operation, human oversight</title>
<desc id="desc">Three connected engineering principles with simple icons and a restrained dark technology design.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1b28"/><stop offset="1" stop-color="#10242e"/></linearGradient>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.s{font-family:Inter,Arial,Helvetica,sans-serif}
.l{stroke:#3b6671;stroke-width:1.2}.accent{stroke:#62d5c6;stroke-width:2.5;fill:none}
</style>
</defs>
<rect x="1" y="1" width="1198" height="222" rx="12" fill="url(#bg)" stroke="#2a5465"/>
<g class="l"><path d="M400 30V193M800 30V193"/></g>
<g transform="translate(38 35)">
<circle cx="36" cy="36" r="26" fill="#123742" stroke="#34737a"/>
<path class="accent" d="M20 36L30 46L50 26"/><text class="m" x="75" y="25" fill="#8cc6bd" font-size="12" letter-spacing="2">01 / EVIDENCE</text>
<text class="s" x="75" y="55" fill="#eef8f7" font-size="24" font-weight="700">Prove the claim.</text>
<text class="m" x="8" y="109" fill="#9bbbc5" font-size="15">Traceable inputs and</text><text class="m" x="8" y="132" fill="#9bbbc5" font-size="15">reproducible results.</text>
</g>
<g transform="translate(433 35)">
<circle cx="36" cy="36" r="26" fill="#123742" stroke="#34737a"/>
<path class="accent" d="M36 20V36L48 42M23 46L28 50"/><text class="m" x="75" y="25" fill="#8cc6bd" font-size="12" letter-spacing="2">02 / RELIABILITY</text>
<text class="s" x="75" y="55" fill="#eef8f7" font-size="24" font-weight="700">Design for failure.</text>
<text class="m" x="8" y="109" fill="#9bbbc5" font-size="15">Recovery paths, boundaries,</text><text class="m" x="8" y="132" fill="#9bbbc5" font-size="15">and explicit unknowns.</text>
</g>
<g transform="translate(829 35)">
<circle cx="36" cy="36" r="26" fill="#123742" stroke="#34737a"/>
<path class="accent" d="M20 31L36 22L52 31V44L36 53L20 44Z"/><path class="accent" d="M29 38L35 44L44 33"/>
<text class="m" x="75" y="25" fill="#8cc6bd" font-size="12" letter-spacing="2">03 / CONTROL</text>
<text class="s" x="75" y="55" fill="#eef8f7" font-size="24" font-weight="700">Keep humans in.</text>
<text class="m" x="8" y="109" fill="#9bbbc5" font-size="15">Inspectable decisions,</text><text class="m" x="8" y="132" fill="#9bbbc5" font-size="15">approval before action.</text>
</g>
</svg>