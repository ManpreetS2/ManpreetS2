<svg viewBox="0 0 1000 44" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CareerPilot detail captions">
  <style>
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .draw { stroke-dasharray:904; stroke-dashoffset:0; }
    .rise,.fade,.row { opacity:1; }
    @keyframes draw { from { stroke-dashoffset:904; } to { stroke-dashoffset:0; } }
    .a1{animation-delay:.08s} .a2{animation-delay:.16s} .a3{animation-delay:.24s}
    .a4{animation-delay:.32s} .a5{animation-delay:.4s} .a6{animation-delay:.48s}
    .r1{animation-delay:.1s} .r2{animation-delay:.2s} .r3{animation-delay:.3s}
    .r4{animation-delay:.4s} .r5{animation-delay:.5s}
    @media (prefers-reduced-motion: no-preference) {
      .draw { animation:draw 1.1s cubic-bezier(.6,0,.2,1) forwards; }
    }
</style>
  <text class="mono fade a1" x="48" y="20" fill="#0F1729" font-size="13">Rule-backed Fit with job / resume evidence</text>
  <text class="mono fade a1" x="48" y="38" fill="#5A6578" font-size="11" letter-spacing="1.2">required_skills · satisfied · scoring effect</text>
  <text class="mono fade a2" x="524" y="20" fill="#0F1729" font-size="13">Source-traced drafts before approval</text>
  <text class="mono fade a2" x="524" y="38" fill="#5A6578" font-size="11" letter-spacing="1.2">cover letter · recruiter note · claim map</text>
</svg>
