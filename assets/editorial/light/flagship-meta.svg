<svg viewBox="0 0 1000 188" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CareerPilot — evidence-driven job search workspace">
  <style>
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .draw { stroke-dasharray:904; stroke-dashoffset:0; }
    .rise,.fade,.row { opacity:1; }
    @keyframes draw { from { stroke-dashoffset:904; } to { stroke-dashoffset:0; } }
    .a1{animation-delay:.08s} .a2{animation-delay:.16s} .a3{animation-delay:.24s}
    .a4{animation-delay:.32s} .a5{animation-delay:.4s} .a6{animation-delay:.48s}
    .r1{animation-delay:.1s} .r2{animation-delay:.2s} .r3{animation-delay:.3s}
    .r4{animation-delay:.4s} .r5{animation-delay:.5s}
    @media (prefers-reduced-motion: no-preference) {
      .draw { animation:draw 1.1s cubic-bezier(.6,0,.2,1) forwards; }
    }
</style>

  <line class="draw a1" x1="48" y1="24" x2="952" y2="24" stroke="#B0BACC" stroke-width="1"/>
  <text class="mono fade a1" x="48" y="16" fill="#0B8F8A" font-size="11" letter-spacing="3.2">FLAGSHIP · 02 / CAREERPILOT</text>
  <text class="mono fade a1" x="952" y="16" fill="#5F4F8F" font-size="11" letter-spacing="2" text-anchor="end">LOCAL / SELF-HOSTABLE</text>

  <text class="mono rise a2" x="48" y="78" fill="#0F1729" font-size="44" letter-spacing="-1.5">CareerPilot</text>
  <text class="mono fade a3" x="48" y="114" fill="#1A2438" font-size="18">Evidence-driven job search workspace</text>
  <text class="mono fade a4" x="48" y="148" fill="#3D4A5F" font-size="14">Python · FastAPI · React · TypeScript · SQLite · Chrome Extension</text>

  <line class="draw a5" x1="48" y1="172" x2="952" y2="172" stroke="#B0BACC" stroke-width="1"/>
  <text class="mono fade a5" x="48" y="186" fill="#5A6578" font-size="11" letter-spacing="2.5">PRODUCT VIEW  ▸  DISCOVER WORKSPACE</text>
  <text class="mono fade a5" x="952" y="186" fill="#5A6578" font-size="11" letter-spacing="2" text-anchor="end">FIG. 02</text>
</svg>
