<svg viewBox="0 0 1000 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Technical toolkit">
  <style>
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .draw { stroke-dasharray:200; stroke-dashoffset:0; }
    .rise,.fade,.row { opacity:1; }
    @keyframes draw { from { stroke-dashoffset:200; } to { stroke-dashoffset:0; } }
    @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fade { from { opacity:0; } to { opacity:1; } }
    .a1{animation-delay:.1s} .a2{animation-delay:.25s} .a3{animation-delay:.4s}
    .a4{animation-delay:.55s} .a5{animation-delay:.7s} .a6{animation-delay:.85s}
    .r1{animation-delay:.2s} .r2{animation-delay:.35s} .r3{animation-delay:.5s}
    @media (prefers-reduced-motion: no-preference) {
      .draw { animation:draw 1.3s cubic-bezier(.6,0,.2,1) both; }
      .rise { animation:rise .7s cubic-bezier(.2,.7,.2,1) both; }
      .fade { animation:fade .65s ease both; }
      .row { animation:rise .65s cubic-bezier(.2,.7,.2,1) both; }
    }
</style>
  <line x1="148" y1="8" x2="148" y2="188" stroke="#B0BACC" stroke-width="1" opacity=".45"/>
  <text class="mono rise a1" x="48" y="30" fill="#5A6578" font-size="12" letter-spacing="2">LANGUAGES</text>
  <text class="mono rise a1" x="168" y="30" fill="#0F1729" font-size="15">Python · TypeScript · Java · JavaScript · SQL</text><text class="mono rise a2" x="48" y="64" fill="#5A6578" font-size="12" letter-spacing="2">BACKEND</text>
  <text class="mono rise a2" x="168" y="64" fill="#0F1729" font-size="15">FastAPI · Node.js · REST APIs</text><text class="mono rise a3" x="48" y="98" fill="#5A6578" font-size="12" letter-spacing="2">FRONTEND</text>
  <text class="mono rise a3" x="168" y="98" fill="#0F1729" font-size="15">React · JavaFX</text><text class="mono rise a4" x="48" y="132" fill="#5A6578" font-size="12" letter-spacing="2">DATA</text>
  <text class="mono rise a4" x="168" y="132" fill="#0F1729" font-size="15">PostgreSQL · SQLite · DuckDB</text><text class="mono rise a5" x="48" y="166" fill="#5A6578" font-size="12" letter-spacing="2">TOOLING</text>
  <text class="mono rise a5" x="168" y="166" fill="#0F1729" font-size="15">Git · Docker · GitHub Actions · pytest · Vitest · Playwright · JUnit</text>
</svg>
