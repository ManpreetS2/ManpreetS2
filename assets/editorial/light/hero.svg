<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Manpreet Singh — software engineering, AI systems, and fintech</title>
  <desc id="desc">Animated editorial hero for Manpreet Singh's developer portfolio.</desc>
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B8F8A"/>
      <stop offset="0.55" stop-color="#5F4F8F"/>
      <stop offset="1" stop-color="#B85040"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="42%" r="42%">
      <stop offset="0" stop-color="#0B8F8A" stop-opacity=".16"/>
      <stop offset="0.55" stop-color="#5F4F8F" stop-opacity=".08"/>
      <stop offset="1" stop-color="#0B8F8A" stop-opacity="0"/>
    </radialGradient>
    <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: ui-sans-serif, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.2s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    /* Opacity-only rise: transform on text nodes inside img SVGs often never completes. */
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0; } to { opacity:1; } }
    .lift { opacity: 0; animation: lift .75s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes lift { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
    .fade { opacity: 0; animation: fade .6s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    .travel { stroke-dasharray: 5 9; animation: travel 18s linear infinite; }
    @keyframes travel { to { stroke-dashoffset: -280; } }
    .caret { animation: blink 1.05s steps(1,end) infinite; }
    @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
    .a1{animation-delay:.08s} .a2{animation-delay:.2s} .a3{animation-delay:.35s}
    .a4{animation-delay:.5s} .a5{animation-delay:.65s} .a6{animation-delay:.8s}
    .a7{animation-delay:.95s} .d1{animation-delay:.6s} .d2{animation-delay:1.1s} .d3{animation-delay:1.6s}
    @media (prefers-reduced-motion: reduce) {
      .draw,.rise,.lift,.fade,.pulse,.travel,.caret { animation: none !important; }
      .draw { stroke-dashoffset: 0; }
      .rise,.lift,.fade { opacity: 1; transform: none; }
      .pulse { opacity: 1; }
      .caret { opacity: 1; }
    }
</style>
  </defs>

  <rect width="1200" height="420" fill="transparent"/>
  <ellipse cx="920" cy="180" rx="320" ry="220" fill="url(#glow)"/>

  <line class="draw a1" x1="48" y1="56" x2="1152" y2="56" stroke="#B8C2D4" stroke-width="1"/>
  <g class="fade a1 mono">
    <text x="48" y="40" fill="#4E596E" font-size="12" letter-spacing="3.2">MS / ENGINEERING PORTFOLIO</text>
    <text x="1152" y="40" fill="#4E596E" font-size="12" letter-spacing="3.2" text-anchor="end">EST. IN CURIOSITY</text>
  </g>

  <g class="fade a2 mono">
    <text x="48" y="108" fill="#0B8F8A" font-size="15" letter-spacing="4.5">HELLO, I'M</text>
  </g>
  <g class="lift a3">
    <text class="sans" x="46" y="188" fill="#0F1729" font-size="74" font-weight="700" letter-spacing="-2.8">MANPREET</text>
    <text class="sans" x="46" y="268" fill="url(#nameGrad)" font-size="74" font-weight="700" letter-spacing="-2.8">SINGH</text>
    <rect class="caret" x="318" y="216" width="4" height="48" rx="1" fill="#0B8F8A"/>
  </g>

  <g class="fade a4 mono">
    <text x="48" y="308" fill="#4E596E" font-size="16">Software · AI systems · Fintech tooling</text>
  </g>
  <g class="fade a5 mono">
    <text x="48" y="338" fill="#7A8499" font-size="13" letter-spacing="1.2">focus ▸</text>
    <text x="118" y="338" fill="#0F1729" font-size="13" letter-spacing=".3">evidence-backed products · reliable systems · human oversight</text>
  </g>

  <!-- Signal panel -->
  <g class="fade a4" transform="translate(780 96)">
    <rect x="0" y="0" width="340" height="210" rx="10" fill="#F5F7FC" stroke="#B8C2D4" stroke-width="1"/>
    <text class="mono" x="18" y="28" fill="#7A8499" font-size="11" letter-spacing="2.5">SYSTEM TRACE / 001</text>
    <path class="travel" d="M40 78 H120 M180 78 H260 M150 110 V148" stroke="#0B8F8A" stroke-width="1.6" fill="none" opacity=".85"/>
    <g class="pulse">
      <rect x="28" y="58" width="92" height="42" rx="7" fill="#EEF2FA" stroke="#0B8F8A" stroke-opacity=".45"/>
      <text class="mono" x="40" y="76" fill="#0B8F8A" font-size="10" letter-spacing="1">01 INPUT</text>
      <text class="mono" x="40" y="92" fill="#0F1729" font-size="13" font-weight="600">observe</text>
    </g>
    <g class="pulse d1">
      <rect x="138" y="58" width="92" height="42" rx="7" fill="#EEF2FA" stroke="#5F4F8F" stroke-opacity=".55"/>
      <text class="mono" x="150" y="76" fill="#5F4F8F" font-size="10" letter-spacing="1">02 VERIFY</text>
      <text class="mono" x="150" y="92" fill="#0F1729" font-size="13" font-weight="600">ground</text>
    </g>
    <g class="pulse d2">
      <rect x="248" y="58" width="72" height="42" rx="7" fill="#EEF2FA" stroke="#B85040" stroke-opacity=".5"/>
      <text class="mono" x="258" y="76" fill="#B85040" font-size="10" letter-spacing="1">03 OUT</text>
      <text class="mono" x="258" y="92" fill="#0F1729" font-size="13" font-weight="600">deliver</text>
    </g>
    <circle class="pulse d3" cx="150" cy="158" r="5" fill="#0B8F8A"/>
    <text class="mono" x="164" y="162" fill="#0F1729" font-size="13">traceable state</text>
    <text class="mono" x="18" y="194" fill="#7A8499" font-size="10" letter-spacing="1.4">BUILT TO BE UNDERSTOOD</text>
    <text class="mono" x="322" y="194" fill="#7A8499" font-size="10" letter-spacing="1.4" text-anchor="end">LOCAL-FIRST</text>
  </g>

  <line class="draw a5" x1="48" y1="368" x2="1152" y2="368" stroke="#B8C2D4" stroke-width="1"/>
  <g class="fade a6 mono">
    <text x="48" y="396" fill="#4E596E" font-size="12" letter-spacing="1.6">DE ANZA COLLEGE  →  SAN JOSÉ STATE UNIVERSITY / SPRING 2027</text>
    <text x="1152" y="396" fill="#4E596E" font-size="12" letter-spacing="1.6" text-anchor="end">github.com/ManpreetS2</text>
  </g>
</svg>
<!-- mode:light -->
