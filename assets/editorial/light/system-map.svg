<svg viewBox="0 0 1000 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="System map — CareerPilot at the center of products, integrations, AI, and research">
  <style>
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .draw { stroke-dasharray:500; stroke-dashoffset:0; }
    .rise,.fade,.row { opacity:1; }
    @keyframes draw { from { stroke-dashoffset:500; } to { stroke-dashoffset:0; } }
    .a1{animation-delay:.08s} .a2{animation-delay:.16s} .a3{animation-delay:.24s}
    .a4{animation-delay:.32s} .a5{animation-delay:.4s} .a6{animation-delay:.48s}
    .r1{animation-delay:.1s} .r2{animation-delay:.2s} .r3{animation-delay:.3s}
    .r4{animation-delay:.4s} .r5{animation-delay:.5s}
    @media (prefers-reduced-motion: no-preference) {
      .draw { animation:draw 1.1s cubic-bezier(.6,0,.2,1) forwards; }
    }
</style>

  <text class="mono fade a1" x="48" y="28" fill="#3D4A5F" font-size="11" letter-spacing="3">HOW THE WORK CONNECTS</text>
  <text class="mono fade a1" x="952" y="28" fill="#3D4A5F" font-size="11" letter-spacing="2" text-anchor="end">FIG. 03</text>
  <line class="draw a1" x1="48" y1="40" x2="952" y2="40" stroke="#B0BACC" stroke-width="1"/>

  <!-- Hub spokes: CareerPilot bottom edge → satellite tops (true edge-to-edge) -->
  <line class="draw a2" x1="420" y1="190" x2="180" y2="210" stroke="#B0BACC" stroke-width="1.25"/>
  <line class="draw a2" x1="580" y1="190" x2="820" y2="210" stroke="#B0BACC" stroke-width="1.25"/>
  <line class="draw a3" x1="420" y1="190" x2="180" y2="310" stroke="#B0BACC" stroke-width="1.25"/>
  <line class="draw a3" x1="580" y1="190" x2="820" y2="310" stroke="#B0BACC" stroke-width="1.25"/>

  <g class="rise a2">
    <rect x="340" y="100" width="320" height="90" rx="2" fill="#E4EAF5" stroke="#0B8F8A" stroke-width="1.5"/>
    <text class="mono" x="500" y="136" fill="#0B8F8A" font-size="12" letter-spacing="3" text-anchor="middle">FLAGSHIP</text>
    <text class="mono" x="500" y="164" fill="#0F1729" font-size="22" letter-spacing="-0.5" text-anchor="middle">CareerPilot</text>
    <text class="mono" x="500" y="186" fill="#3D4A5F" font-size="12" text-anchor="middle">evidence · workflow · human control</text>
  </g>

  <g class="rise a3">
    <rect x="48" y="210" width="264" height="72" rx="2" fill="#EEF2F8" stroke="#0B8F8A" stroke-width="1.25"/>
    <text class="mono" x="180" y="240" fill="#0B8F8A" font-size="11" letter-spacing="2" text-anchor="middle">PRODUCTS</text>
    <text class="mono" x="180" y="264" fill="#0F1729" font-size="13" text-anchor="middle">StrikeCaller · PagePulse</text>
  </g>
  <g class="rise a3">
    <rect x="688" y="210" width="264" height="72" rx="2" fill="#EEF2F8" stroke="#5F4F8F" stroke-width="1.25"/>
    <text class="mono" x="820" y="240" fill="#5F4F8F" font-size="11" letter-spacing="2" text-anchor="middle">AI EXPERIMENTATION</text>
    <text class="mono" x="820" y="264" fill="#0F1729" font-size="13" text-anchor="middle">R.E.A.C.T. · Minecraft AI Civ.</text>
  </g>
  <g class="rise a4">
    <rect x="48" y="310" width="264" height="72" rx="2" fill="#EEF2F8" stroke="#B85040" stroke-width="1.25"/>
    <text class="mono" x="180" y="340" fill="#B85040" font-size="11" letter-spacing="2" text-anchor="middle">INTEGRATIONS</text>
    <text class="mono" x="180" y="364" fill="#0F1729" font-size="13" text-anchor="middle">IntegrationLab · reliability</text>
  </g>
  <g class="rise a4">
    <rect x="688" y="310" width="264" height="72" rx="2" fill="#EEF2F8" stroke="#0B8F8A" stroke-width="1.25"/>
    <text class="mono" x="820" y="340" fill="#0B8F8A" font-size="11" letter-spacing="2" text-anchor="middle">QUANT RESEARCH</text>
    <text class="mono" x="820" y="364" fill="#0F1729" font-size="13" text-anchor="middle">EquityTrace</text>
  </g>

  <text class="mono fade a5" x="48" y="408" fill="#3D4A5F" font-size="12" letter-spacing="1.5">SHARED THREAD — inspectable data paths · careful interfaces · human final control</text>
</svg>
