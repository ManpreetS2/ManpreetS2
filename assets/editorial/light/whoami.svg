<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" fill="none" role="img" aria-labelledby="t d">
  <title id="t">About Manpreet Singh</title>
  <desc id="d">Concise bio, focus areas, status, and education.</desc>
  <defs><style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: ui-sans-serif, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.2s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    /* Opacity-only rise: transform on text nodes inside img SVGs often never completes. */
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0; } to { opacity:1; } }
    .lift { opacity: 0; animation: lift .75s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes lift { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
    .fade { opacity: 0; animation: fade .6s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    .travel { stroke-dasharray: 5 9; animation: travel 18s linear infinite; }
    @keyframes travel { to { stroke-dashoffset: -280; } }
    .caret { animation: blink 1.05s steps(1,end) infinite; }
    @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
    .a1{animation-delay:.08s} .a2{animation-delay:.2s} .a3{animation-delay:.35s}
    .a4{animation-delay:.5s} .a5{animation-delay:.65s} .a6{animation-delay:.8s}
    .a7{animation-delay:.95s} .d1{animation-delay:.6s} .d2{animation-delay:1.1s} .d3{animation-delay:1.6s}
    @media (prefers-reduced-motion: reduce) {
      .draw,.rise,.lift,.fade,.pulse,.travel,.caret { animation: none !important; }
      .draw { stroke-dashoffset: 0; }
      .rise,.lift,.fade { opacity: 1; transform: none; }
      .pulse { opacity: 1; }
      .caret { opacity: 1; }
    }
</style></defs>
  <text class="mono rise a1" x="48" y="36" fill="#0F1729" font-size="16">Computer Science @ De Anza College · Incoming San José State University, Spring 2027.</text>
  <text class="mono rise a2" x="48" y="68" fill="#0F1729" font-size="16">I build practical software, AI-powered tools, and systems designed around reliability.</text>
  <text class="mono rise a3" x="48" y="100" fill="#4E596E" font-size="15">Prefer products where claims stay grounded in evidence and humans keep final control.</text>

  <line class="fade a4" x1="48" y1="128" x2="1152" y2="128" stroke="#B8C2D4" stroke-width="1"/>

  <text class="mono rise a4" x="48" y="164" fill="#7A8499" font-size="11" letter-spacing="2.8">FOCUS</text>
  <text class="mono rise a4" x="148" y="164" fill="#0F1729" font-size="15">Full-stack systems · Explainable AI tooling · Fintech research · Local-first apps</text>

  <text class="mono rise a5" x="48" y="196" fill="#7A8499" font-size="11" letter-spacing="2.8">STATUS</text>
  <text class="mono rise a5" x="148" y="196" fill="#0B8F8A" font-size="15">Open to software engineering, solutions engineering, and technical internships</text>

  <text class="mono rise a6" x="48" y="228" fill="#7A8499" font-size="11" letter-spacing="2.8">EDU</text>
  <text class="mono rise a6" x="148" y="228" fill="#0F1729" font-size="15">De Anza College → San José State University / Spring 2027</text>
</svg>
<!-- mode:light -->
