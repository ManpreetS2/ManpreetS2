<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" fill="none" role="img" aria-label="Closing sign-off">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B8F8A"/>
      <stop offset="1" stop-color="#5F4F8F"/>
    </linearGradient>
    <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: ui-sans-serif, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .pulse { opacity: 1; }
    @keyframes pulse {
      0%,100% { opacity: .55; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
    }
</style>
  </defs>
  <line x1="48" y1="28" x2="1152" y2="28" stroke="#B8C2D4" stroke-width="1.25"/>
  <text class="sans" x="48" y="78" fill="#0F1729" font-size="28" font-weight="700" letter-spacing="-0.4">Building systems you can trace.</text>
  <g class="mono">
    <text x="48" y="112" fill="#4E596E" font-size="16">Open to software engineering, solutions engineering, and technical internships.</text>
    <text x="48" y="142" fill="url(#fg)" font-size="15" letter-spacing="2.4">MANPREET SINGH</text>
    <circle class="pulse" cx="1088" cy="100" r="6" fill="#0B8F8A"/>
    <text x="1074" y="142" fill="#0B8F8A" font-size="14" letter-spacing="2.5" text-anchor="end">AVAILABLE</text>
  </g>
</svg>
