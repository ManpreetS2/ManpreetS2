<svg viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CareerPilot three engineering highlights">
  <defs><style>
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .sans { font-family:ui-sans-serif,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    
    .draw { stroke-dasharray:1000; stroke-dashoffset:0; }
    .rise,.fade,.pop,.row { opacity:1; }
    .flow { stroke-dasharray:3 9; opacity:.35; }
    .pulse { opacity:1; }
    .caret { opacity:1; }
    @keyframes draw { from { stroke-dashoffset:1000; } to { stroke-dashoffset:0; } }
    @keyframes rise { from { opacity:0; } to { opacity:1; } }
    @keyframes fade { from { opacity:0; } to { opacity:1; } }
    @keyframes pop { from { opacity:0; } to { opacity:1; } }
    @keyframes march { to { stroke-dashoffset:-12; } }
    @keyframes pulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }
    @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
    .a1{animation-delay:.08s}.a2{animation-delay:.2s}.a3{animation-delay:.35s}
    .a4{animation-delay:.5s}.a5{animation-delay:.65s}.a6{animation-delay:.8s}
    .w1{animation-delay:.15s}.w2{animation-delay:.28s}.w3{animation-delay:.4s}
    .w4{animation-delay:.52s}.w5{animation-delay:.64s}.w6{animation-delay:.76s}
    .p0{animation-delay:.1s}.p1{animation-delay:.45s}.p2{animation-delay:.55s}
    .p3{animation-delay:.65s}.p4{animation-delay:.75s}.p5{animation-delay:.85s}
    .p6{animation-delay:.95s}.p7{animation-delay:1.05s}.p8{animation-delay:1.15s}
    .r1{animation-delay:.05s}.r2{animation-delay:.12s}.r3{animation-delay:.19s}
    .r4{animation-delay:.26s}.r5{animation-delay:.33s}
    @media (prefers-reduced-motion:no-preference) {
      .draw { animation:draw 1.2s cubic-bezier(.6,0,.2,1) both; }
      .rise { animation:rise .65s cubic-bezier(.2,.7,.2,1) both; }
      .fade { animation:fade .55s ease both; }
      .pop { animation:pop .65s cubic-bezier(.2,.7,.2,1) both; }
      .row { animation:rise .5s cubic-bezier(.2,.7,.2,1) both; }
      .flow { animation:march 1.4s linear infinite; }
      .pulse { animation:pulse 2.6s ease-in-out infinite; }
      .caret { animation:blink 1.05s steps(1,end) infinite; }
    }

</style></defs>
  <text class="mono fade a1" x="48" y="18" fill="#6E7890" font-size="11" letter-spacing="3">THREE ENGINEERING HIGHLIGHTS</text>
  <g class="row r1 mono">
    <text x="48" y="36" fill="#0B8F8A" font-size="14" letter-spacing="2.5">01 / FIT</text>
    <text x="230" y="36" fill="#0F1729" font-size="15">Explainable, evidence-based Fit scoring grounded in resume and posting text</text>
    <line x1="48" y1="56" x2="952" y2="56" stroke="#B8C2D4" stroke-width="1" opacity=".55"/>
  </g><g class="row r2 mono">
    <text x="48" y="92" fill="#5F4F8F" font-size="14" letter-spacing="2.5">02 / WORKFLOW</text>
    <text x="230" y="92" fill="#0F1729" font-size="15">Complete job-search loop: discover → analyze → prepare → track</text>
    <line x1="48" y1="112" x2="952" y2="112" stroke="#B8C2D4" stroke-width="1" opacity=".55"/>
  </g><g class="row r3 mono">
    <text x="48" y="148" fill="#B85040" font-size="14" letter-spacing="2.5">03 / EXTENSION</text>
    <text x="230" y="148" fill="#0F1729" font-size="15">Human-controlled Chrome extension that assists fills and never submits</text>
    <line x1="48" y1="168" x2="952" y2="168" stroke="#B8C2D4" stroke-width="1" opacity=".55"/>
  </g>
</svg>
