<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 72" fill="none" role="img" aria-label="CareerPilot highlights — Fit, workflow, extension">
  <defs><style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: ui-sans-serif, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .pulse { opacity: 1; }
    @keyframes pulse {
      0%,100% { opacity: .55; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
    }
</style></defs>
  <line x1="48" y1="20" x2="1152" y2="20" stroke="#B8C2D4" stroke-width="1"/>
  <g class="mono">
    <text x="48" y="50" fill="#0B8F8A" font-size="17" letter-spacing="2.2">01 / FIT</text>
    <text x="200" y="50" fill="#B8C2D4" font-size="17">·</text>
    <text x="230" y="50" fill="#5F4F8F" font-size="17" letter-spacing="2.2">02 / WORKFLOW</text>
    <text x="470" y="50" fill="#B8C2D4" font-size="17">·</text>
    <text x="500" y="50" fill="#B85040" font-size="17" letter-spacing="2.2">03 / EXTENSION</text>
    <text x="1152" y="50" fill="#6E7890" font-size="14" letter-spacing="2" text-anchor="end">HUMAN SUBMITS</text>
  </g>
</svg>
<!-- mode:light -->
