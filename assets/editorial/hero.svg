<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Manpreet Singh — software engineering, AI systems, and financial technology</title>
<desc id="desc">Dark editorial developer banner featuring Manpreet Singh, a subtle animated cursor and interconnected system modules.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#07121f"/><stop offset=".62" stop-color="#0b1d2a"/><stop offset="1" stop-color="#061421"/>
  </linearGradient>
  <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#a7f3d0"/><stop offset="1" stop-color="#5de2e7"/>
  </linearGradient>
  <radialGradient id="aura"><stop stop-color="#14b8a6" stop-opacity=".18"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" stroke="#3b6371" stroke-opacity=".17" fill="none"/></pattern>
  <style>
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .sans{font-family:Inter,Arial,Helvetica,sans-serif}
  .node{animation:heartbeat 3.7s ease-in-out infinite;transform-origin:center}
  .delay{animation-delay:1.3s}.delay2{animation-delay:2.3s}
  .caret{animation:blink 1.1s steps(1,end) infinite}
  .trail{stroke-dasharray:6 10;animation:travel 20s linear infinite}
  @keyframes heartbeat{0%,100%{opacity:.62}50%{opacity:1}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes travel{to{stroke-dashoffset:-320}}
  @media(prefers-reduced-motion:reduce){.node,.caret,.trail{animation:none}}
  </style>
</defs>
<rect width="1200" height="400" rx="12" fill="url(#bg)"/>
<rect width="1200" height="400" rx="12" fill="url(#grid)"/>
<ellipse cx="910" cy="175" rx="365" ry="300" fill="url(#aura)"/>
<g class="mono" fill="#8ea5b6" font-size="13" letter-spacing="2">
  <text x="55" y="45">MS / ENGINEERING PORTFOLIO</text>
  <text x="1145" y="45" text-anchor="end">EST. IN CURIOSITY</text>
</g>
<path d="M55 64H1145" stroke="#315163" stroke-width="1"/>
<g>
  <text class="mono" x="55" y="122" fill="#7dd3c4" font-size="16" letter-spacing="4">HELLO, I'M</text>
  <text class="sans" x="49" y="210" font-size="77" font-weight="800" letter-spacing="-3.5" fill="#f3f7fa">MANPREET</text>
  <text class="sans" x="54" y="292" font-size="78" font-weight="800" letter-spacing="-3" fill="url(#mint)">SINGH.</text>
  <rect class="caret" x="337" y="242" width="5" height="54" rx="1.5" fill="#65e4d5"/>
  <text class="mono" x="56" y="344" fill="#c0d4dd" font-size="17">SOFTWARE  /  AI SYSTEMS  /  FINTECH</text>
</g>
<!-- Original systems graphic: signal from input through constraints to observable output -->
<g transform="translate(697 100)" class="mono">
  <text x="2" y="-12" font-size="12" letter-spacing="2" fill="#658e9d">SYSTEM TRACE / 001</text>
  <rect x="0" y="0" width="415" height="228" rx="13" fill="#081826" fill-opacity=".75" stroke="#28556a"/>
  <g stroke="#355f73" fill="none" opacity=".85">
    <path d="M115 66H172M237 66H302"/>
    <path d="M83 100V164H170M334 101V164H238"/>
    <path d="M205 101V141"/>
  </g>
  <g stroke="#47d6cb" stroke-width="2" fill="none" class="trail">
    <path d="M115 66H172M237 66H302"/>
    <path d="M205 101V141"/>
  </g>
  <g class="node">
    <rect x="18" y="35" width="115" height="65" rx="9" fill="#102b3b" stroke="#367388"/>
    <text x="36" y="59" fill="#8bcfc9" font-size="11" letter-spacing="1">01 / INPUT</text>
    <text x="36" y="82" fill="#f1f8f8" font-size="17" font-weight="700">observe</text>
  </g>
  <g class="node delay">
    <rect x="161" y="35" width="95" height="65" rx="9" fill="#0e3040" stroke="#43999c"/>
    <text x="175" y="59" fill="#7bd8c9" font-size="11" letter-spacing="1">02 / RULES</text>
    <text x="175" y="82" fill="#f1f8f8" font-size="17" font-weight="700">verify</text>
  </g>
  <g class="node delay2">
    <rect x="283" y="35" width="114" height="65" rx="9" fill="#102b3b" stroke="#367388"/>
    <text x="299" y="59" fill="#8bcfc9" font-size="11" letter-spacing="1">03 / OUTPUT</text>
    <text x="299" y="82" fill="#f1f8f8" font-size="17" font-weight="700">deliver</text>
  </g>
  <rect x="122" y="144" width="168" height="49" rx="7" fill="#103c44" stroke="#318c8b"/>
  <circle cx="145" cy="169" r="6" fill="#53ddba" class="node delay"/>
  <text x="161" y="175" fill="#e4f7f4" font-size="15">traceable state</text>
  <text x="18" y="211" fill="#789bac" font-size="10.5" letter-spacing="1.5">BUILT TO BE UNDERSTOOD</text>
  <text x="397" y="211" fill="#789bac" font-size="10.5" letter-spacing="1.5" text-anchor="end">● LOCAL FIRST</text>
</g>
<path d="M55 368H1145" stroke="#315163" stroke-width="1"/>
<text x="55" y="387" class="mono" fill="#7596a6" font-size="12" letter-spacing="1.35">DE ANZA COLLEGE   →   SAN JOSÉ STATE UNIVERSITY / SPRING 2027</text>
<text x="1145" y="387" class="mono" fill="#7596a6" font-size="12" text-anchor="end">github.com/ManpreetS2</text>
</svg>